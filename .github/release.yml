# GitHub Releases の自動生成ノートで PR をカテゴリ分けするための設定。
# docs: https://docs.github.com/ja/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# ラベルが未付与の PR は "Other Changes" に集約されるため、既存の
# ラベル運用を変更せずに段階的にカテゴリ化を進められる。

changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
        - breaking
    - title: New Features
      labels:
        - feature
        - enhancement
        - feat
    - title: Bug Fixes
      labels:
        - bug
        - fix
        - bugfix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Dependencies
      labels:
        - dependencies
        - deps
    - title: Other Changes
      labels:
        - "*"
